kind = "web"
previewPath = "/"
title = "Nearo — Task Management Landing Page"
description = "A polished landing page for Nearo, a task management mobile app. Features a hero section with phone mockups, feature cards, a 3-step onboarding section, testimonials, and a footer. Designed for potential users and beta sign-ups."
version = "1.0.0"
id = "artifacts/nearo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21570

[services.development]
run = "pnpm --filter @workspace/nearo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nearo", "run", "build" ]
serve = "static"
publicDir = "artifacts/nearo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21570"
BASE_PATH = "/"
