# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Requires that any npm package version has been published for at least 1 day
# (1440 minutes) before pnpm will install it. Most malicious npm releases are
# discovered and pulled within hours, so this is a strong safety buffer.
#
# DO NOT DISABLE. Setting this to 0 leaves the project vulnerable to
# supply-chain attacks, which have been the #1 vector for npm ecosystem
# compromises.
# ============================================================================
minimumReleaseAge: 1440

# Packages allowed to run install/postinstall scripts. esbuild needs this to
# fetch its platform binary.
allowBuilds:
  esbuild: true
